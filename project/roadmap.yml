# -----------------------------------------------------------------------------
# ISSUES
# body : Markdown. DoD = Definition of Done (critères d'acceptation).
# -----------------------------------------------------------------------------
issues:
  # ---------------------------- M0 -------------------------------------------
  - title: "Dépôt, arborescence et conventions (labels, templates, roadmap)"
    milestone: m0
    labels: ["type:chore", "area:infra", "priority:p0"]
    body: |
      **Objectif** — Poser la structure du dépôt et les conventions de collaboration.

      **Tâches**
      - [ ] Arborescence : `generate/ data/ sql/ etl/ dags/ ml/ dashboards/ tests/ docs/`
      - [ ] `project/roadmap.yml` + `scripts/sync_github.py`
      - [ ] `.github/ISSUE_TEMPLATE` et `PULL_REQUEST_TEMPLATE.md`
      - [ ] `.gitignore` (secrets, données volumineuses, caches)

      **DoD** — `sync_github.py --dry-run` s'exécute sans erreur ; aucun secret dans le dépôt.

  - title: "Environnement Docker : 2 PostgreSQL + Metabase + utilisateur lecture seule"
    milestone: m0
    labels: ["type:chore", "area:infra", "priority:p0"]
    body: |
      **Objectif** — Rendre l'extraction réelle : base source distincte de l'entrepôt.

      **Tâches**
      - [ ] `docker-compose.yml` : `pg_source` (5433), `pg_dwh` (5434), `metabase` (3000)
      - [ ] Schémas `stg, dwh, etl, ml, nlp` créés à l'init
      - [ ] Rôle `bi_reader` en lecture seule pour Metabase
      - [ ] `.env.example` documenté, `.env` ignoré par Git

      **DoD** — `docker compose up -d` puis `bi_reader` peut lire les schémas mais pas écrire.

  - title: "Environnement Python versionné (3.12) et requirements"
    milestone: m0
    labels: ["type:chore", "area:infra", "priority:p0"]
    body: |
      **Objectif** — Reproductibilité de l'exécution locale.

      **Tâches**
      - [ ] `python3.12 -m venv .venv`
      - [ ] `requirements.txt` (pandas, SQLAlchemy, psycopg, Faker, scikit-learn, statsmodels, Prophet, spaCy)
      - [ ] `python -m spacy download fr_core_news_md`

      **DoD** — `pip install -r requirements.txt` réussit et `import pandas, sklearn, spacy` fonctionne.

  - title: "Dossier de conception — cadrage, hypothèses et chaîne de valeur"
    milestone: m0
    labels: ["type:docs", "area:docs", "priority:p0"]
    body: |
      **Objectif** — Fixer le contexte validé par l'enseignant.

      **Tâches**
      - [ ] Contexte : Cameroun, cacao (Centre/Sud/SO/Est), café (Ouest/NO/Littoral), ports Douala/Kribi
      - [ ] Hypothèses : FCFA (XAF), campagne oct→sept, 4 campagnes 2022/23 → 2025/26
      - [ ] Schéma de la chaîne de valeur (6 maillons)
      - [ ] Tableau des 6 questions de la direction → pages → indicateurs/IA

      **DoD** — Document relu et hypothèses validées.

  # ---------------------------- M1 -------------------------------------------
  - title: "Générateur des référentiels : coopératives, producteurs, parcelles"
    milestone: m1
    labels: ["type:feature", "area:generation", "role:A-sources", "priority:p0"]
    body: |
      **Objectif** — Produire les référentiels qui alimentent toutes les autres sources.

      **Tâches**
      - [ ] `generate/referentiels.py` — 25 000 producteurs, 35 000 parcelles, ~120 coopératives
      - [ ] Graine fixe (`--seed 42`) et facteur `--scale` (0.01 → 1.0)
      - [ ] `sql/source/02_tables.sql` : schéma `coop`
      - [ ] 4 instantanés GeoJSON pour le SCD2 (changements coop/certif, radiations)

      **DoD** — Rejouer le générateur produit exactement le même jeu ; clés cohérentes.

  - title: "Générateur des livraisons (300 000) avec saisonnalité"
    milestone: m1
    labels: ["type:feature", "area:generation", "role:A-sources", "priority:p0"]
    body: |
      **Objectif** — Porter le volume principal de la collecte.

      **Tâches**
      - [ ] Saisonnalité : pic oct-déc, moyen avr-juin, creux le reste
      - [ ] `poids_net` lognormal borné ; `poids_brut ≥ poids_net`
      - [ ] Cohérence `producteur_id`, `cooperative_id`, `parcelle_id`
      - [ ] `updated_at` pour le filigrane

      **DoD** — 300 000 lignes en base source, distribution vérifiée.

  - title: "Générateur du contrôle qualité des lots (150 000) + observations texte étiquetées"
    milestone: m1
    labels: ["type:feature", "area:generation", "area:nlp", "role:A-sources", "priority:p0"]
    body: |
      **Objectif** — Mesures qualité probabilistes et corpus NLP annoté.

      **Tâches**
      - [ ] `humidite_pct` (Beta ~7,5 %), `grains_defectueux_pct`, `nb_grains_comptes`
      - [ ] Rejet **probabiliste** (pas de règle exacte) ; `grade` dérivé de la décision
      - [ ] Observation texte : 40–60 gabarits, fautes de frappe, 10–15 % multi-défauts
      - [ ] Étiquette réelle conservée (≥ 3 000 pour l'entraînement NLP)

      **DoD** — Rejet ~5 %, distribution non séparable trivialement.

  - title: "Générateur des paiements Mobile Money (280 000, JSON par jour)"
    milestone: m1
    labels: ["type:feature", "area:generation", "role:A-sources", "priority:p0"]
    body: |
      **Objectif** — Alimenter les indicateurs de prix, délai et canaux.

      **Tâches**
      - [ ] Un fichier JSON par jour dans `data/inbox/` puis archivage
      - [ ] `operateur` : MTN_MOMO, ORANGE_MONEY, VIREMENT, ESPECES ; `statut`
      - [ ] Prix producteur corrélé au prix mondial (55–75 %)

      **DoD** — Chaque `paiement_id` pointe vers une livraison existante (sauf orphelins injectés).

  - title: "Générateur des logs GPS de transport (600 000 pings → trajets)"
    milestone: m1
    labels: ["type:feature", "area:generation", "role:A-sources", "priority:p1"]
    body: |
      **Objectif** — Porter le reste du volume et alimenter la logistique.

      **Tâches**
      - [ ] Pings : horodatage, camion, lot, lat/lon, vitesse, événement, poids
      - [ ] Durée fonction de la distance coopérative→port et de la saison des pluies
      - [ ] Agrégation en ~25 000 trajets pour `fait_transport`

      **DoD** — Corridors plausibles dans la boîte englobante du Cameroun.

  - title: "Générateurs complémentaires : contrats XML (+XSD), intrants Excel, trafic portuaire CSV"
    milestone: m1
    labels: ["type:feature", "area:generation", "role:A-sources", "priority:p1"]
    body: |
      **Objectif** — Couvrir les formats XML, Excel et CSV.

      **Tâches**
      - [ ] Contrats XML valides contre un XSD, clauses en texte libre + champs structurés
      - [ ] Intrants : un classeur Excel par mois (60 000 lignes)
      - [ ] Trafic portuaire CSV : escales, attente à quai (90 000)

      **DoD** — Validation XSD OK ; un classeur par mois présent.

  - title: "Collecte et cache des 7 sources publiques + fichiers de repli"
    milestone: m1
    labels: ["type:feature", "area:sources", "role:A-sources", "priority:p0"]
    body: |
      **Objectif** — Rendre la démonstration indépendante d'Internet.

      **Tâches**
      - [ ] ICCO, ICO, Pink Sheet, FAOSTAT, NASA POWER, Open-Meteo, Frankfurter
      - [ ] Cache/fichier de repli dans `data/reference/`
      - [ ] Homogénéisation : cts/lb → USD/t ; EUR/XAF (655,957)

      **DoD** — ETL capable de tourner hors-ligne grâce aux replis.

  - title: "Injection des anomalies contrôlées (taux connus)"
    milestone: m1
    labels: ["type:feature", "area:quality", "role:A-sources", "priority:p0"]
    body: |
      **Objectif** — Un ETL sans défaut à nettoyer ne prouve rien.

      **Tâches**
      - [ ] Doublons 2 % · nulls 1–2 % · aberrantes 0,5 % · dates mixtes 3 %
      - [ ] FK orphelines 0,3 % · GPS impossibles 0,5 %
      - [ ] Chaque défaut relié à la règle qui doit le détecter

      **DoD** — « 2 % de doublons détectés, 100 % rejetés » démontrable.

  - title: "Dictionnaire de données et catalogue des sources"
    milestone: m1
    labels: ["type:docs", "area:docs", "role:A-sources", "priority:p1"]
    body: |
      **Objectif** — Tracer chaque champ, son unité, sa source et sa règle de qualité.

      **DoD** — Un tableau par source : champ, type, unité, obligatoire, règle associée.

  # ---------------------------- M2 -------------------------------------------
  - title: "DDL des dimensions (Type 1 et 2) et de dim_date"
    milestone: m2
    labels: ["type:feature", "area:dwh", "role:B-dwh-etl", "priority:p0"]
    body: |
      **Objectif** — Poser le modèle conforme.

      **Tâches**
      - [ ] 12 dimensions ; `dim_produit`, `dim_geographie`, `dim_canal`, `dim_acheteur`, `dim_port`...
      - [ ] `dim_date` 2000→2030 avec campagne oct-sept et week-end
      - [ ] SCD2 sur `dim_producteur` et `dim_cooperative` (index unique de version courante)

      **DoD** — Scripts DDL versionnés rejouables sans erreur.

  - title: "DDL des 9 tables de faits, contraintes et index"
    milestone: m2
    labels: ["type:feature", "area:dwh", "role:B-dwh-etl", "priority:p0"]
    body: |
      **Objectif** — Matérialiser les processus métier.

      **Tâches**
      - [ ] `fait_livraison, fait_paiement, fait_qualite_lot, fait_transport, fait_export, fait_prix_marche, fait_meteo, fait_intrants, fait_trafic_port`
      - [ ] Clé métier unique (upsert idempotent), `est_supprime`, `etl_run_id`, `maj_le`
      - [ ] Index sur dates et dimensions principales

      **DoD** — Chevauchement partiel des dimensions (constellation) cohérent.

  - title: "Matrice processus × dimensions et justification des grains"
    milestone: m2
    labels: ["type:docs", "area:dwh", "role:B-dwh-etl", "priority:p0"]
    body: |
      **Objectif** — Justifier chaque grain avant de dessiner une colonne.

      **DoD** — Tableau grains + matrice processus × dimensions dans le dossier.

  - title: "Historisation SCD2 de producteur et coopérative"
    milestone: m2
    labels: ["type:feature", "area:dwh", "role:B-dwh-etl", "priority:p0"]
    body: |
      **Objectif** — Garder l'historique des changements d'affiliation.

      **Tâches**
      - [ ] `hash_diff` md5 des attributs suivis
      - [ ] Fermeture de version `date_fin = date_effet - 1`, `est_courant = FALSE`
      - [ ] Jointure temporelle des faits sur l'intervalle

      **DoD** — Démontrable au run 2 (changement de coopérative).

  # ---------------------------- M3 -------------------------------------------
  - title: "Couche de staging (stg.*) avec traçabilité"
    milestone: m3
    labels: ["type:feature", "area:etl", "role:B-dwh-etl", "priority:p0"]
    body: |
      **Objectif** — Copier les sources telles quelles avant tout contrôle.

      **DoD** — Une table de staging par source avec `run_id` et `charge_le`.

  - title: "10 règles de qualité et table etl.rejet"
    milestone: m3
    labels: ["type:feature", "area:quality", "role:C-orchestration", "priority:p0"]
    body: |
      **Objectif** — Rejeter proprement et tracer.

      **Tâches**
      - [ ] R01 doublons · R02 non-nullité · R03 domaines · R04 intégrité · R05 dates
      - [ ] R06 paiement · R07 cohérence temporelle · R08 GPS · R09 XSD · R10 texte vide

      **DoD** — `etl.rejet` contient règle, clé et valeur JSON par ligne rejetée.

  - title: "Transformations : normalisation, dérivation FCFA/kg, hachages"
    milestone: m3
    labels: ["type:feature", "area:etl", "role:B-dwh-etl", "priority:p0"]
    body: |
      **DoD** — Dates ISO, unités homogènes, prix convertis au taux de la date.

  - title: "Chargement des dimensions puis des faits (transaction, upsert)"
    milestone: m3
    labels: ["type:feature", "area:etl", "role:B-dwh-etl", "priority:p0"]
    body: |
      **DoD** — `ON CONFLICT` sur la clé métier ; dimensions résolues avant les faits.

  - title: "Journalisation etl.run_log, watermark et fichier_traite"
    milestone: m3
    labels: ["type:feature", "area:etl", "area:orchestration", "role:C-orchestration", "priority:p0"]
    body: |
      **DoD** — Chaque exécution tracée (statut, compteurs, filigranes avant/après).

  - title: "Reprise sur incident (transaction, filigrane, idempotence)"
    milestone: m3
    labels: ["type:feature", "area:etl", "role:C-orchestration", "priority:p0"]
    body: |
      **Objectif** — Reproduire le run 4 : échec au milieu, relance sans doublon.

      **DoD** — FAILED puis SUCCESS, filigrane inchangé après l'échec, zéro doublon.

  - title: "Tests automatiques : qualité, SCD2, idempotence"
    milestone: m3
    labels: ["type:test", "area:quality", "role:C-orchestration", "priority:p1"]
    body: |
      **DoD** — Scénario runs 0→4 vérifié par assertions de comptage.

  # ---------------------------- M4 -------------------------------------------
  - title: "Extraction incrémentale par filigrane (livraison.updated_at)"
    milestone: m4
    labels: ["type:feature", "area:etl", "role:B-dwh-etl", "priority:p0"]
    body: |
      **DoD** — Recouvrement de 5 minutes ; seules les nouveautés/modifs sont lues.

  - title: "Détection des modifications (hachage) et des suppressions (journal CDC)"
    milestone: m4
    labels: ["type:feature", "area:etl", "role:B-dwh-etl", "priority:p0"]
    body: |
      **Objectif** — Gérer nouvelles lignes, modifications et suppressions.

      **DoD** — Suppression logique `est_supprime = TRUE`, journal `coop.cdc_journal`.

  - title: "Scénario de démonstration runs 0→4 et comptages attendus"
    milestone: m4
    labels: ["type:docs", "type:test", "area:etl", "role:C-orchestration", "priority:p0"]
    body: |
      **DoD** — Tableau run par run avec les comptages attendus dans l'entrepôt.

  - title: "DAG Airflow — planification nocturne (mécanisme A)"
    milestone: m4
    labels: ["type:feature", "area:orchestration", "role:C-orchestration", "priority:p0"]
    body: |
      **DoD** — DAG `0 2 * * *` : staging → qualité → dimensions → faits → ML/NLP.

  - title: "DAG Airflow — capteur de fichier inbox (mécanisme B)"
    milestone: m4
    labels: ["type:feature", "area:orchestration", "role:C-orchestration", "priority:p0"]
    body: |
      **DoD** — Dépôt d'un `paiements_AAAAMMJJ.json` déclenche le DAG puis archivage.

  - title: "(Option) Déclencheur de base + pg_notify (mécanisme C)"
    milestone: m4
    labels: ["type:feature", "area:orchestration", "role:C-orchestration", "priority:p2"]
    body: |
      **DoD** — Insertion dans `coop.livraison` vue comme déclenchement `EVENEMENT`.

  # ---------------------------- M5 -------------------------------------------
  - title: "Page 1 · Synthèse — indicateurs 1 à 5"
    milestone: m5
    labels: ["type:feature", "area:dwh", "area:bi", "role:D-ml-bi", "priority:p0"]
    body: |
      **Indicateurs** — 1 Tonnage collecté · 2 Prix moyen payé · 3 Taux de lots refusés · 4 Marge filière · 5 CA export.

      **DoD** — 5 requêtes SQL + définitions formelles ; jamais de moyenne de moyennes.

  - title: "Page 2 · Production et collecte — indicateurs 6 à 10"
    milestone: m5
    labels: ["type:feature", "area:dwh", "area:bi", "role:D-ml-bi", "priority:p0"]
    body: |
      **Indicateurs** — 6 Tonnage/région · 7 Tonnage/coopérative · 8 Rendement/ha · 9 Producteurs actifs · 10 Parcelles actives.

  - title: "Page 3 · Qualité — indicateurs 11 à 15"
    milestone: m5
    labels: ["type:feature", "area:dwh", "area:bi", "role:D-ml-bi", "priority:p0"]
    body: |
      **Indicateurs** — 11 Humidité moyenne · 12 Grains défectueux · 13 Part grade 1 · 14 Lots refusés/coopérative · 15 Délai d'analyse.

  - title: "Page 4 · Prix et finances — indicateurs 16 à 20"
    milestone: m5
    labels: ["type:feature", "area:dwh", "area:bi", "role:D-ml-bi", "priority:p0"]
    body: |
      **Indicateurs** — 16 Écart prix producteur/mondial · 17 Évolution mensuelle · 18 Mobile Money · 19 Délai de paiement · 20 Impact du change.

  - title: "Page 5 · Logistique et export — indicateurs 21 à 25"
    milestone: m5
    labels: ["type:feature", "area:dwh", "area:bi", "role:D-ml-bi", "priority:p0"]
    body: |
      **Indicateurs** — 21 Délai champ→port · 22 Coût transport/t · 23 Pertes transport · 24 Conteneurs EVP · 25 Retards de chargement.

  - title: "Indicateur d'actualité : date du dernier chargement"
    milestone: m5
    labels: ["type:feature", "area:bi", "role:D-ml-bi", "priority:p1"]
    body: |
      **DoD** — Requête sur `etl.run_log` affichée sur les 5 pages.

  # ---------------------------- M6 -------------------------------------------
  - title: "ML1 · Prévision des tonnages par région et campagne"
    milestone: m6
    labels: ["type:feature", "area:ml", "role:D-ml-bi", "priority:p0"]
    body: |
      **Objectif** — Anticiper les tonnages mensuels (modèle panel + météo décalée).

      **DoD** — Sortie `ml.prevision_tonnage` + `ml.metrique_modele` (MAPE, WAPE, gain vs référence).

  - title: "ML2 · Prédiction du rejet d'un lot"
