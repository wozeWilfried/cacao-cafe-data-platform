    labels: ["type:feature", "area:ml", "role:D-ml-bi", "priority:p0"]
    body: |
      **Objectif** — Probabilité de rejet ; cible rare (~5 %), seuil sur précision-rappel.

      **DoD** — Sortie `ml.score_rejet_lot` + matrice de confusion ; pas de fuite (pas de `grade`).

  - title: "ML3 · Prévision du prix mondial et simulation de marge"
