# =============================================================================
# Roadmap du Projet 9 — Filière cacao & café
# Source de vérité pour les labels, jalons (milestones) et issues GitHub.
# Ce fichier est lu par scripts/sync_github.py (idempotent).
# =============================================================================

# -----------------------------------------------------------------------------
# LABELS  (convention : namespace:nom)
# -----------------------------------------------------------------------------
labels:
  # Type de travail
  - { name: "type:feature", color: "0e8a16", description: "Nouvelle fonctionnalité ou livrable" }
  - { name: "type:chore",   color: "c5def5", description: "Tâche technique / outillage" }
  - { name: "type:bug",     color: "d73a4a", description: "Anomalie à corriger" }
  - { name: "type:docs",    color: "0075ca", description: "Documentation / dossier de conception" }
  - { name: "type:test",    color: "fbca04", description: "Tests et qualité logicielle" }
  - { name: "type:spike",   color: "5319e7", description: "Exploration / vérification technique" }

  # Domaine fonctionnel / couche
  - { name: "area:sources",       color: "1d76db", description: "Sources publiques et API" }
  - { name: "area:generation",    color: "bfd4f2", description: "Génération des données" }
  - { name: "area:dwh",           color: "0e8a16", description: "Modélisation de l'entrepôt" }
  - { name: "area:etl",           color: "f9d0c4", description: "Pipeline ETL" }
  - { name: "area:quality",       color: "d4c5f9", description: "Règles de qualité et rejets" }
  - { name: "area:orchestration", color: "c2e0c6", description: "Airflow et déclenchement" }
  - { name: "area:ml",            color: "5319e7", description: "Machine Learning" }
  - { name: "area:nlp",           color: "a2eeef", description: "Traitement du langage" }
  - { name: "area:bi",            color: "fbca04", description: "Tableau de bord" }
  - { name: "area:docs",          color: "0075ca", description: "Documentation" }
  - { name: "area:infra",         color: "ededed", description: "Docker, environnements, CI" }

  # Priorité
  - { name: "priority:p0", color: "b60205", description: "Socle indispensable" }
  - { name: "priority:p1", color: "d93f0b", description: "Solide / attendu" }
  - { name: "priority:p2", color: "fbca04", description: "Remarquable / option" }

  # Rôle porteur (équipe de 4)
  - { name: "role:A-sources",       color: "c2e0c6", description: "A · Sources et génération" }
  - { name: "role:B-dwh-etl",       color: "f9d0c4", description: "B · Modèle et ETL" }
  - { name: "role:C-orchestration", color: "bfd4f2", description: "C · Orchestration et qualité" }
  - { name: "role:D-ml-bi",         color: "d4c5f9", description: "D · ML, NLP et BI" }

# -----------------------------------------------------------------------------
# JALONS  (milestones = phases du projet)
# -----------------------------------------------------------------------------
milestones:
  - { key: m0, title: "M0 · Cadrage et environnement", description: "Dépôt propre, conventions, Docker, environnement Python, cadrage validé." }
  - { key: m1, title: "M1 · Sources de données",       description: "15 sources lisibles (7 publiques + 8 générées), anomalies injectées, catalogue." }
  - { key: m2, title: "M2 · Entrepôt modélisé",        description: "Dimensions, 9 faits, dim_date, SCD2, matrice et grains justifiés." }
  - { key: m3, title: "M3 · ETL et qualité",           description: "Staging, 10 règles de qualité, journal, rejets, reprise sur incident." }
  - { key: m4, title: "M4 · Incrémental et déclenchement", description: "Filigrane, hachage, suppressions, DAGs Airflow (planification + fichier)." }
  - { key: m5, title: "M5 · 25 indicateurs",           description: "25 indicateurs définis et vérifiés par requête SQL, répartis en 5 pages." }
  - { key: m6, title: "M6 · Machine Learning et NLP",  description: "3 ML + 2 NLP, sorties dans ml/nlp avec métriques d'évaluation." }
  - { key: m7, title: "M7 · Tableau de bord",          description: "5 pages, filtres communs, navigation, fraîcheur des données." }
  - { key: m8, title: "M8 · Dossier, tests et soutenance", description: "Dossier de conception, tests automatisés, support et répétition." }

# -----------------------------------------------------------------------------
# TERMINÉ  (issues à fermer ; le script passe leur état à « closed »)
# Ajouter ici le titre EXACT d'une issue achevée puis relancer le script.
# -----------------------------------------------------------------------------
