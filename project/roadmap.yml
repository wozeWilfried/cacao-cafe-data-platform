  - "Collecte et cache des 7 sources publiques + fichiers de repli"
  - "DDL des dimensions (Type 1 et 2) et de dim_date"
  - "DDL des 9 tables de faits, contraintes et index"
  - "Matrice processus × dimensions et justification des grains"
  - "Couche de staging (stg.*) avec traçabilité"
  - "10 règles de qualité et table etl.rejet"
  - "Transformations : normalisation, dérivation FCFA/kg, hachages"
  - "Chargement des dimensions puis des faits (transaction, upsert)"
  - "Journalisation etl.run_log, watermark et fichier_traite"
  - "Reprise sur incident (transaction, filigrane, idempotence)"
  - "Historisation SCD2 de producteur et coopérative"
  - "Extraction incrémentale par filigrane (livraison.updated_at)"
  - "Détection des modifications (hachage) et des suppressions (journal CDC)"
  - "Scénario de démonstration runs 0→4 et comptages attendus"
